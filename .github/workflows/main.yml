name: Executor de Dados Autônomo Real 24/7

on:
  schedule:
    # Dispara o script automaticamente a cada 2 horas (Horário UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente quando quiser

jobs:
  executar-e-salvar:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonando o repositório
      uses: actions/checkout@v4

    - name: 🐍 Configurando Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 💎 Executando Minerador de Dados Real (API Binance)
      run: python minerador_real.py

    - name: 🔄 Salvando Dados e Atualizando Repositório de Forma Autônoma
      run: |
        git config --global user.name "Robo-Binance-Data"
        git config --global user.email "bot-data@github.com"
        git add datasets_financeiros/
        # SÓ FAZ O COMMIT SE HOUVER ARQUIVO NOVO PARA EVITAR ERROS NO SISTEMA
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [BOT] Dados reais atualizados via API da Binance" && git push)
