name: Executor de Dados Autônomo Real 24/7
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
jobs:
  executar-e-salvar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: python minerador_real.py
    - run: |
        git config --global user.name "Robo-Binance"
        git config --global user.email "bot@github.com"
        git add datasets_financeiros/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Dados atualizados" && git push)
